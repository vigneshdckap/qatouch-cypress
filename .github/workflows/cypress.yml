
name: Cypress Automation Tests

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress-run:
    name: Run Cypress Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npm run cy:run
        env:
          QATOUCH_DOMAIN: ${{ secrets.QATOUCH_DOMAIN }}
          QATOUCH_API_TOKEN: ${{ secrets.QATOUCH_API_TOKEN }}
          QATOUCH_PROJECT_KEY: ${{ secrets.QATOUCH_PROJECT_KEY }}
          QATOUCH_TEST_RUN_ID: ${{ secrets.QATOUCH_TEST_RUN_ID }}

      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/
          if-no-files-found: ignore
          retention-days: 7
